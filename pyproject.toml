[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mule-ring-detector"
version = "0.1.0"
description = "Graph-Based Detection of Money Mule Rings in Financial Networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dhruv Gourisaria", email = "dhruvgourisaria@gmail.com" }
]
dependencies = [
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "streamlit>=1.30.0",
    "pyvis>=0.3.2",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
